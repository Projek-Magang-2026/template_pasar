<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Gagal — Pasar Connect WiFi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container" style="justify-content: center; align-items: center; padding: 28px 20px; min-height: 100vh;">

    <!-- Header -->
    <header class="app-header" style="position: absolute; top: 0; left: 0; right: 0;">
        <div class="header-title-wrapper">
            <svg class="wifi-pulse-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" d="M1.371 8.143a.75.75 0 0 1 1.022-.24 15.618 15.618 0 0 1 19.214 0 .75.75 0 1 1-.782 1.28 14.118 14.118 0 0 0-17.65 0 .75.75 0 0 1-1.804-1.04ZM4.143 11.23a.75.75 0 0 1 1.002-.276 11.118 11.118 0 0 1 13.71 0 .75.75 0 1 1-.84 1.246 9.618 9.618 0 0 0-11.87 0 .75.75 0 0 1-1.002-.97ZM6.963 14.28a.75.75 0 0 1 .978-.328 6.618 6.618 0 0 1 8.118 0 .75.75 0 1 1-.896 1.206 5.118 5.118 0 0 0-6.222 0 .75.75 0 0 1-.978-.878ZM9.75 17.25a.75.75 0 0 1 1.097-.66 2.13 2.13 0 0 1 2.306 0 .75.75 0 1 1-.818 1.258.63.63 0 0 0-.67 0 .75.75 0 0 1-.915-.598Z" clip-rule="evenodd" />
            </svg>
            <span>Pasar Connect</span>
        </div>
        <span class="header-status">OFFLINE</span>
    </header>

    <!-- Error Card -->
    <main class="main-card" style="flex: none; width: 100%; max-width: 370px; border: 1.5px solid #FECACA; border-radius: 20px; padding: 32px 22px; margin-top: 60px; background: #fff; box-shadow: 0 8px 32px rgba(220,38,38,0.08);">

        <!-- Error Icon -->
        <div style="text-align: center; margin-bottom: 18px;">
            <div style="width: 56px; height: 56px; border-radius: 16px; background: #FEF2F2; border: 1.5px solid #FECACA; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 26px;">❌</div>
        </div>

        <div class="portal-welcome" style="margin-bottom: 18px;">
            <h1 class="portal-title" style="color: #DC2626; font-size: 18px;">Koneksi Gagal</h1>
            <p class="portal-subtitle">Terjadi kesalahan saat mencoba menghubungkan perangkat ke WiFi</p>
        </div>

        <!-- Error Detail -->
        <div class="error-box" style="margin-bottom: 20px;">
            <span>⚠️</span>
            <div>
                <strong>Informasi Kendala:</strong><br>
                <span>$(error-message)</span>
            </div>
        </div>

        <!-- Retry Button -->
        <a href="login.html" class="btn-primary" style="text-decoration: none; background: linear-gradient(135deg, var(--primary), var(--primary-dark));">
            Coba Login Kembali
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
        </a>

        <footer class="brand-footer" style="margin-top: 24px;">
            &copy; 2026 Pasar Connect &mdash; WiFi Pusat Perdagangan
        </footer>
    </main>

</div>

</body>
</html>
